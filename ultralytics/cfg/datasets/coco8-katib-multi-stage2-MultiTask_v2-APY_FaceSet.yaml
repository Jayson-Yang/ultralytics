# coco8-katib-multi-stage2-MultiTask_v2-APY_FaceSet.yaml
# path: /home/jovyan/datasets
path: /katib/datasets
train:
  - MultiTask_v2/images/train
  - APY_FaceSet/images/train

val:
  - MultiTask_v2/images/val
  - APY_FaceSet/images/val

test: # test images (optional)

# Classes
names:
  0: head
  1: body
  2: phonecall
  3: cellphone
  4: face

train_dataset_fractions: [0.65, 0.35]  # 略提高 WIDER_FACE 采样，利于 face / WIDER AP
# val_dataset_fractions: [0.75, 0.25]

# 分类 loss 按类加权（顺序同 names）；face=1.0 不压低，其余类降权把梯度让给 face
# 优先级：phonecall(1.0) > cellphone(0.75) > head/body(0.55)
# 调参约束：非 face 四类看 YOLO val 的 AP50（metrics.box.ap50），跌幅 ≤5%；face 看 WIDER 官方 Easy AP（主）/ Medium / Hard
class_weights: [0.55, 0.55, 1.0, 0.75, 1.0]

# WIDER FACE 官方评测（与 train/val 数据集无关，GT 与图片分开放置）
# GT：wider_face_val.mat + wider_easy/medium/hard_val.mat → wider_gt_dir
# 图片：本配置 val 不含 WIDER → 自动在 wider_val 目录侧载推理（默认 WIDER_FACE/images/val）
wider_eval: true
wider_gt_dir: WIDER_FACE/wider_face_split  # 相对 path；仅放四个 .mat
wider_face_class: 4                         # names 中 face 的类别 id
wider_val: WIDER_FACE/images/val          # sidecar 推理目录（与 MultiTask_v2/APY_FaceSet val 无关）
wider_fitness: true                       # 用 Easy AP 作为 fitness（早停/最佳权重）；Katib 主目标可直读 metrics/wider_easy_ap